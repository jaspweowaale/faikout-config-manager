name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t faikout-config-manager:ci .

      - name: Start container
        run: docker run -d --name faikout-ci -p 8765:8765 -e ENABLE_LIVE_WRITES=false faikout-config-manager:ci

      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/ || echo "000")
            if [ "$CODE" = "401" ]; then
              echo "App responded 401 (auth required) -- container is up and serving requests"
              exit 0
            fi
            sleep 1
          done
          echo "App did not respond as expected within 15s (last code: $CODE)"
          docker logs faikout-ci
          exit 1

      - name: Verify the authenticated status endpoint works
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, urllib.request, base64

          creds = json.loads(subprocess.check_output(
              ["docker", "exec", "faikout-ci", "cat", "/data/auth.json"]))
          token = base64.b64encode(f"{creds['username']}:{creds['password']}".encode()).decode()
          req = urllib.request.Request(
              "http://localhost:8765/api/status",
              headers={"Authorization": f"Basic {token}"},
          )
          body = json.loads(urllib.request.urlopen(req, timeout=10).read())
          assert body["live_writes_enabled"] is False, body
          print("status endpoint OK:", body)
          PYEOF

      - name: Show container logs on failure
        if: failure()
        run: docker logs faikout-ci

      - name: Clean up container
        if: always()
        run: docker rm -f faikout-ci || true
